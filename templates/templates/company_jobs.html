<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Jobs - Campus Career Hub</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="dashboard-nav">

    <div class="logo">
        Campus Career Hub
    </div>

    <div class="nav-links">

        <a href="/company/dashboard">
            Dashboard
        </a>

        <a href="/company/job/create">
            Post Job
        </a>

        <a href="/logout">
            Logout
        </a>

    </div>

</nav>


<main class="jobs-container">

    <h1>My Job Postings</h1>


    <div class="jobs-grid">

        {% for job in jobs %}

        <div class="job-card">

            <span class="job-type">
                {{ job.job_type }}
            </span>

            <h2>
                {{ job.title }}
            </h2>

            <p>
                📍 {{ job.location }}
            </p>

            <p>
                🎓 CGPA: {{ job.min_cgpa }}
            </p>

            <p>
                💰 {{ job.salary }}
            </p>

            <p>
                Status:
                <strong>{{ job.status }}</strong>
            </p>

            <a
                href="/company/job/{{ job.id }}/edit"
                class="job-button"
            >
                Edit
            </a>

            <form
                method="POST"
                action="/company/job/{{ job.id }}/delete"
                style="display:inline;"
            >

                <button
                    type="submit"
                    class="job-button"
                >
                    Delete
                </button>

            </form>

        </div>

        {% else %}

        <p>
            You haven't posted any jobs yet.
        </p>

        {% endfor %}

    </div>

</main>

</body>

</html>
