
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | Campus Career Hub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #1f2937;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            margin: 4px;
            background: #1d4ed8;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .btn:hover {
            background: #1e40af;
        }

        .table-container {
            overflow-x: auto;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background: #172554;
            color: white;
        }

        tr:hover td {
            background: #f9fafb;
        }

        .role {
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 25px;
        }
    </style>
</head>

<body>
<div class="container">

    <div class="topbar">
        <div>
            <h1>User Management</h1>
            <p>View registered Campus Career Hub accounts.</p>
        </div>

        <div>
            <a class="btn"
               href="{{ url_for('admin_dashboard') }}">
                Admin Dashboard
            </a>

            <a class="btn" href="{{ url_for('logout') }}">
                Logout
            </a>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                </tr>
            </thead>

            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user.id }}</td>
                    <td>{{ user.name }}</td>
                    <td>{{ user.email }}</td>
                    <td class="role">{{ user.role }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4" class="empty">
                        No registered users found.
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
