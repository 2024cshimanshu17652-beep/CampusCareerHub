<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Job | Campus Career Hub</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            margin: 0;
            color: #24364b;
        }

        header {
            background: #243b55;
            color: white;
            padding: 20px 6%;
        }

        main {
            max-width: 850px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #00000012;
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 18px;
            margin-bottom: 6px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .row > div {
            flex: 1;
        }

        .btn {
            margin-top: 25px;
            background: #243b55;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        .btn:hover {
            background: #1b2f45;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            background: #243b55;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h2>Campus Career Hub</h2>
</header>

<main>

    <a href="{{ url_for('company_dashboard') }}" class="back">
        Back to Company Dashboard
    </a>

    <div class="card">

        <h1>Create New Job</h1>

        <form method="POST">

            <label for="title">Job Title</label>
            <input
                type="text"
                id="title"
                name="title"
                placeholder="e.g. Software Developer Intern"
                required
            >

            <label for="description">Job Description</label>
            <textarea
                id="description"
                name="description"
                placeholder="Enter job description"
                required
            ></textarea>

            <div class="row">

                <div>
                    <label for="job_type">Job Type</label>
                    <select id="job_type" name="job_type" required>
                        <option value="">Select Job Type</option>
                        <option value="Internship">Internship</option>
                        <option value="Full Time">Full Time</option>
                        <option value="Part Time">Part Time</option>
                    </select>
                </div>

                <div>
                    <label for="location">Location</label>
                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="e.g. Jaipur"
                        required
                    >
                </div>

            </div>

            <div class="row">

                <div>
                    <label for="min_cgpa">Minimum CGPA</label>
                    <input
                        type="number"
                        id="min_cgpa"
                        name="min_cgpa"
                        min="0"
                        max="10"
                        step="0.01"
                        value="0"
                        required
                    >
                </div>

                <div>
                    <label for="max_backlogs">Maximum Backlogs</label>
                    <input
                        type="number"
                        id="max_backlogs"
                        name="max_backlogs"
                        min="0"
                        value="0"
                        required
                    >
                </div>

            </div>

            <div class="row">

                <div>
                    <label for="salary">Salary / Stipend</label>
                    <input
                        type="text"
                        id="salary"
                        name="salary"
                        placeholder="e.g. ₹20,000/month"
                    >
                </div>

                <div>
                    <label for="deadline">Application Deadline</label>
                    <input
                        type="date"
                        id="deadline"
                        name="deadline"
                        required
                    >
                </div>

            </div>

            <button type="submit" class="btn">
                Create Job
            </button>

        </form>

    </div>

</main>

</body>
</html>
